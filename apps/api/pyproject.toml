[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fashion-cad-api"
version = "0.1.0"
description = "Local-first Fashion CAD Studio API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "reportlab>=4.2,<5.0",
  "svgwrite>=1.4,<2.0",
  "openpyxl>=3.1,<4.0",
  "pypdf>=5.0,<6.0",
  "pymupdf>=1.26,<2.0",
  "rapidocr>=3.9,<4.0",
  "onnxruntime>=1.20,<2.0",
  "trimesh>=4.6,<5.0",
  "FlagEmbedding>=1.3,<2.0",
  "lancedb>=0.25,<1.0",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1.0", "pytest>=8.0,<9.0"]
operator = ["pyautogui>=0.9,<1.0"]

[tool.setuptools]
packages = ["fashion_cad_api"]
